<template>
    <lightning-card title="JSON Form Editor" icon-name="standard:flow">
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <lightning-textarea
                label="Source JSON"
                value={sourceJson}
                onchange={handleSourceChange}
                class="source-area"
            ></lightning-textarea>
            <template lwc:if={parseError}>
                <p class="slds-text-color_error slds-var-m-top_x-small">
                    {parseError}
                </p>
            </template>
            <div class="slds-var-m-top_small button-row">
                <lightning-button
                    label="Load JSON"
                    variant="brand"
                    onclick={handleLoad}
                ></lightning-button>
                <lightning-button
                    label="Load confidence sample"
                    onclick={handleLoadConfidenceSample}
                ></lightning-button>
                <lightning-button
                    label="Load nesting sample"
                    onclick={handleLoadNestingSample}
                ></lightning-button>
            </div>

            <fieldset class="slds-var-m-top_medium feature-toggles">
                <legend class="slds-text-title_caps">Features</legend>
                <lightning-input
                    type="checkbox"
                    label="Edit field names"
                    data-flag="editLabels"
                    checked={editLabels}
                    onchange={handleToggle}
                ></lightning-input>
                <lightning-input
                    type="checkbox"
                    label="Add / delete fields"
                    data-flag="editStructure"
                    checked={editStructure}
                    onchange={handleToggle}
                ></lightning-input>
                <lightning-input
                    type="checkbox"
                    label="Collapsible groups"
                    data-flag="collapsible"
                    checked={collapsible}
                    onchange={handleToggle}
                ></lightning-input>
                <lightning-input
                    type="checkbox"
                    label="Search box"
                    data-flag="searchable"
                    checked={searchable}
                    onchange={handleToggle}
                ></lightning-input>
                <lightning-input
                    type="checkbox"
                    label="Show confidence"
                    data-flag="showConfidence"
                    checked={showConfidence}
                    onchange={handleToggle}
                ></lightning-input>
                <lightning-input
                    type="checkbox"
                    label="Validate types"
                    data-flag="validateTypes"
                    checked={validateTypes}
                    onchange={handleToggle}
                ></lightning-input>
            </fieldset>

            <template lwc:if={loadedJson}>
                <h2
                    class="slds-text-heading_small slds-var-m-top_medium slds-var-m-bottom_x-small"
                >
                    Edit fields
                </h2>
                <c-json-form
                    json-data={loadedJson}
                    edit-labels={editLabels}
                    edit-structure={editStructure}
                    collapsible={collapsible}
                    searchable={searchable}
                    show-confidence={showConfidence}
                    validate-types={validateTypes}
                    onjsonchange={handleJsonChange}
                ></c-json-form>
            </template>

            <template lwc:if={hasModifiedJson}>
                <h2
                    class="slds-text-heading_small slds-var-m-top_medium slds-var-m-bottom_x-small"
                >
                    Modified JSON
                </h2>
                <pre class="output">{modifiedJson}</pre>
            </template>
        </div>
    </lightning-card>
</template>
