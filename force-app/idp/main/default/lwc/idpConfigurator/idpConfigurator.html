<template>
    <lightning-card
        title="IDP Configuration"
        icon-name="standard:record_lookup"
    >
        <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
            <span class={statusClass}>{statusLabel}</span>
        </div>

        <template if:true={error}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                <div
                    class="slds-notify slds-notify_alert slds-theme_error"
                    role="alert"
                >
                    <span class="slds-assistive-text">Error</span>
                    {error}
                </div>
            </div>
        </template>

        <template if:true={loading}>
            <lightning-spinner
                alternative-text="Loading"
                size="small"
            ></lightning-spinner>
        </template>

        <div class="layout">
            <!-- document types -->
            <aside class="sets">
                <p class="pane-title">Document types</p>
                <template for:each={setRows} for:item="entry">
                    <button
                        key={entry.name}
                        class={entry.itemClass}
                        data-name={entry.name}
                        onclick={handleSelect}
                        type="button"
                    >
                        <span class="set-label">{entry.label}</span>
                        <span class="set-meta">{entry.counts}</span>
                        <template if:false={entry.active}>
                            <span class="set-inactive">Inactive</span>
                        </template>
                    </button>
                </template>
                <template if:true={noSelection}>
                    <p class="empty">No document types found.</p>
                </template>
            </aside>

            <!-- editor -->
            <section class="editor">
                <template if:false={noSelection}>
                    <div class="editor-head">
                        <h2 class="editor-title">{label}</h2>
                        <div class="editor-actions">
                            <lightning-button
                                label="Check"
                                onclick={handleCheck}
                                variant="neutral"
                            ></lightning-button>
                            <lightning-button
                                label="Revert"
                                onclick={handleRevert}
                                disabled={revertDisabled}
                                variant="neutral"
                            ></lightning-button>
                            <lightning-button
                                label="Save"
                                onclick={handleSave}
                                disabled={saveDisabled}
                                variant="brand"
                            ></lightning-button>
                        </div>
                    </div>

                    <template if:true={saving}>
                        <p class="hint hint_deploying">
                            Saving deploys custom metadata, which takes a few
                            seconds. Waiting for it to land…
                        </p>
                    </template>

                    <template if:true={hasFindings}>
                        <ul class="findings">
                            <template for:each={findingRows} for:item="finding">
                                <li key={finding.key} class={finding.rowClass}>
                                    <lightning-icon
                                        icon-name={finding.iconName}
                                        size="x-small"
                                        class="slds-m-right_x-small"
                                    ></lightning-icon>
                                    <span>{finding.message}</span>
                                </li>
                            </template>
                        </ul>
                    </template>

                    <lightning-tabset
                        active-tab-value={activeTab}
                        onactive={handleTabChange}
                    >
                        <!-- ─────────────── form ─────────────── -->
                        <lightning-tab label="Rules" value="form">
                            <template if:true={noSections}>
                                <p class="empty">
                                    This document type has no sections yet. Add
                                    one to say which record it fills in.
                                </p>
                            </template>

                            <template for:each={sectionRows} for:item="section">
                                <article key={section.key} class="section-card">
                                    <header class="section-head">
                                        <div class="section-id">
                                            <span class="section-name"
                                                >{section.headline}</span
                                            >
                                            <span class="section-summary"
                                                >{section.summary}</span
                                            >
                                        </div>
                                        <div class="section-tools">
                                            <lightning-input
                                                type="toggle"
                                                label="Active"
                                                variant="label-hidden"
                                                message-toggle-active="Active"
                                                message-toggle-inactive="Off"
                                                checked={section.active}
                                                data-section={section.key}
                                                data-field="active"
                                                onchange={handleFieldChange}
                                            ></lightning-input>
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                alternative-text="Delete section"
                                                title="Delete section"
                                                variant="border-filled"
                                                data-section={section.key}
                                                onclick={handleDeleteSection}
                                            ></lightning-button-icon>
                                        </div>
                                    </header>

                                    <div class="grid">
                                        <lightning-input
                                            label="Name"
                                            value={section.name}
                                            field-level-help="Unique identity for this section. Appears in every message about it."
                                            data-section={section.key}
                                            data-field="name"
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                        <lightning-input
                                            label="Label"
                                            value={section.label}
                                            data-section={section.key}
                                            data-field="label"
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                        <lightning-combobox
                                            label="Region type"
                                            value={section.sectionType}
                                            options={sectionTypeOptions}
                                            data-section={section.key}
                                            data-field="sectionType"
                                            onchange={handleFieldChange}
                                        ></lightning-combobox>
                                        <lightning-combobox
                                            label="Fills in"
                                            value={section.targetObject}
                                            options={objectOptions}
                                            placeholder="Pick an object"
                                            data-section={section.key}
                                            data-field="targetObject"
                                            onchange={handleFieldChange}
                                        ></lightning-combobox>
                                        <lightning-input
                                            label="Record filter"
                                            value={section.recordFilter}
                                            field-level-help="Optional SOQL WHERE fragment narrowing which record is used."
                                            data-section={section.key}
                                            data-field="recordFilter"
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                        <lightning-input
                                            label="Parent section"
                                            value={section.parentSection}
                                            field-level-help="Name of the section whose record constrains this one. Leave blank to let the schema decide."
                                            data-section={section.key}
                                            data-field="parentSection"
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </div>

                                    <template if:true={section.isRepeating}>
                                        <div class="grid grid_repeating">
                                            <lightning-input
                                                label="Rows are at"
                                                value={section.rowPath}
                                                placeholder="e.g. Details"
                                                field-level-help="Path to the list of rows in the document."
                                                data-section={section.key}
                                                data-field="rowPath"
                                                onchange={handleFieldChange}
                                            ></lightning-input>
                                            <lightning-combobox
                                                label="Rows matched on"
                                                value={section.matchField}
                                                options={section.matchFieldOptions}
                                                placeholder="Pick a field"
                                                data-section={section.key}
                                                data-field="matchField"
                                                onchange={handleFieldChange}
                                            ></lightning-combobox>
                                            <lightning-input
                                                label="Row key"
                                                value={section.matchValue}
                                                placeholder="e.g. INV-{json:Invoice}-{row:number}"
                                                field-level-help="Template building each row's key. Tokens: {json:path}, {row:path}, {row:index}, {row:number}."
                                                data-section={section.key}
                                                data-field="matchValue"
                                                onchange={handleFieldChange}
                                            ></lightning-input>
                                        </div>
                                    </template>

                                    <template if:true={section.fieldsUnknown}>
                                        <p class="hint">
                                            Pick an object above and its fields
                                            become selectable below.
                                        </p>
                                    </template>

                                    <!-- rules -->
                                    <div class="rules">
                                        <template
                                            for:each={section.rules}
                                            for:item="rule"
                                        >
                                            <div key={rule.key} class="rule">
                                                <div class="rule-head">
                                                    <span class="rule-name"
                                                        >{rule.headline}</span
                                                    >
                                                    <div class="rule-tools">
                                                        <lightning-input
                                                            type="toggle"
                                                            label="Active"
                                                            variant="label-hidden"
                                                            message-toggle-active="Active"
                                                            message-toggle-inactive="Off"
                                                            checked={rule.active}
                                                            data-section={section.key}
                                                            data-rule={rule.key}
                                                            data-field="active"
                                                            onchange={handleFieldChange}
                                                        ></lightning-input>
                                                        <lightning-button-icon
                                                            icon-name="utility:delete"
                                                            alternative-text="Delete rule"
                                                            title="Delete rule"
                                                            variant="bare"
                                                            data-section={section.key}
                                                            data-rule={rule.key}
                                                            onclick={handleDeleteRule}
                                                        ></lightning-button-icon>
                                                    </div>
                                                </div>
                                                <div class="grid">
                                                    <lightning-input
                                                        label="Name"
                                                        value={rule.name}
                                                        data-section={section.key}
                                                        data-rule={rule.key}
                                                        data-field="name"
                                                        onchange={handleFieldChange}
                                                    ></lightning-input>
                                                    <lightning-input
                                                        label="Label"
                                                        value={rule.label}
                                                        data-section={section.key}
                                                        data-rule={rule.key}
                                                        data-field="label"
                                                        onchange={handleFieldChange}
                                                    ></lightning-input>
                                                    <lightning-input
                                                        label="Read from"
                                                        value={rule.jsonPath}
                                                        placeholder="e.g. applicant.email"
                                                        field-level-help="Dot path into the document. Relative to the row inside a repeating section."
                                                        data-section={section.key}
                                                        data-rule={rule.key}
                                                        data-field="jsonPath"
                                                        onchange={handleFieldChange}
                                                    ></lightning-input>
                                                    <lightning-combobox
                                                        label="Write to"
                                                        value={rule.targetField}
                                                        options={rule.targetFieldOptions}
                                                        placeholder="Pick a field"
                                                        data-section={section.key}
                                                        data-rule={rule.key}
                                                        data-field="targetField"
                                                        onchange={handleFieldChange}
                                                    ></lightning-combobox>
                                                    <lightning-combobox
                                                        label="Parsed as"
                                                        value={rule.valueTypeName}
                                                        options={valueTypeOptions}
                                                        data-section={section.key}
                                                        data-rule={rule.key}
                                                        data-field="valueTypeName"
                                                        onchange={handleFieldChange}
                                                    ></lightning-combobox>
                                                    <lightning-combobox
                                                        label="Overwrite"
                                                        value={rule.overwritePolicy}
                                                        options={policyOptions}
                                                        data-section={section.key}
                                                        data-rule={rule.key}
                                                        data-field="overwritePolicy"
                                                        onchange={handleFieldChange}
                                                    ></lightning-combobox>
                                                    <lightning-combobox
                                                        label="Mode"
                                                        value={rule.mode}
                                                        options={modeOptions}
                                                        data-section={section.key}
                                                        data-rule={rule.key}
                                                        data-field="mode"
                                                        onchange={handleFieldChange}
                                                    ></lightning-combobox>
                                                    <lightning-combobox
                                                        label="Accept"
                                                        value={rule.minGrade}
                                                        options={gradeOptions}
                                                        data-section={section.key}
                                                        data-rule={rule.key}
                                                        data-field="minGrade"
                                                        onchange={handleFieldChange}
                                                    ></lightning-combobox>
                                                    <lightning-input
                                                        type="number"
                                                        step="0.01"
                                                        min="0"
                                                        max="1"
                                                        label="Min confidence"
                                                        value={rule.minConfidence}
                                                        field-level-help="0–1. Only used when the document states a confidence for the value."
                                                        data-section={section.key}
                                                        data-rule={rule.key}
                                                        data-field="minConfidence"
                                                        onchange={handleFieldChange}
                                                    ></lightning-input>
                                                    <lightning-input
                                                        label="Anchor filter"
                                                        value={rule.anchorFilter}
                                                        field-level-help="Optional SOQL WHERE fragment narrowing which record this value lands on."
                                                        data-section={section.key}
                                                        data-rule={rule.key}
                                                        data-field="anchorFilter"
                                                        onchange={handleFieldChange}
                                                    ></lightning-input>
                                                    <lightning-input
                                                        type="checkbox"
                                                        label="Required"
                                                        checked={rule.required}
                                                        field-level-help="A document missing this path is reported as an error instead of skipped."
                                                        data-section={section.key}
                                                        data-rule={rule.key}
                                                        data-field="required"
                                                        onchange={handleFieldChange}
                                                    ></lightning-input>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:false={section.hasRules}>
                                            <p class="empty">No rules yet.</p>
                                        </template>
                                    </div>

                                    <lightning-button
                                        label="Add rule"
                                        icon-name="utility:add"
                                        variant="neutral"
                                        data-section={section.key}
                                        onclick={handleAddRule}
                                        class="add-rule"
                                    ></lightning-button>
                                </article>
                            </template>

                            <lightning-button
                                label="Add section"
                                icon-name="utility:add"
                                variant="brand-outline"
                                onclick={handleAddSection}
                                class="add-section"
                            ></lightning-button>
                        </lightning-tab>

                        <!-- ─────────────── raw json ─────────────── -->
                        <lightning-tab label="Advanced" value="json">
                            <p class="hint">
                                The same definition as text, for bulk edits and
                                copying between orgs. Switching back to Rules
                                re-reads whatever is here. See
                                IDP_CONFIGURATION.md for what every key means.
                            </p>
                            <lightning-button
                                label="Tidy"
                                onclick={handleFormat}
                                variant="neutral"
                                class="slds-m-vertical_x-small"
                            ></lightning-button>
                            <lightning-textarea
                                label="Definition"
                                variant="label-hidden"
                                value={draftJson}
                                onchange={handleJsonChange}
                                class="definition"
                            ></lightning-textarea>
                        </lightning-tab>
                    </lightning-tabset>
                </template>

                <template if:true={noSelection}>
                    <p class="empty">
                        Select a document type to edit its rules.
                    </p>
                </template>
            </section>
        </div>
    </lightning-card>
</template>
