<template>
    <c-lqc-banner
        variant={banner.variant}
        message={banner.message}
        lwc:if={banner}
        onclose={handleBannerClose}
    ></c-lqc-banner>

    <div class="slds-card lqc-grid">
        <div class="slds-card__header lqc-grid__header">
            <h2 class="slds-text-heading_small lqc-grid__title">{title}</h2>
            <div class="lqc-grid__actions">
                <lightning-button
                    label="+ Add"
                    title="Add a new row"
                    disabled={addDisabled}
                    onclick={handleAdd}
                    class="slds-m-left_x-small"
                ></lightning-button>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh"
                    title="Refresh"
                    disabled={refreshDisabled}
                    onclick={handleRefresh}
                    class="slds-m-left_x-small"
                ></lightning-button-icon>
            </div>
        </div>

        <div class="slds-card__body lqc-grid__body">
            <template lwc:if={isBlank}>
                <div class="slds-align_absolute-center slds-p-around_medium slds-text-color_weak">
                    Available in a future version.
                </div>
            </template>
            <template lwc:else>
                <template lwc:if={isLoading}>
                    <lightning-spinner
                        alternative-text="Loading"
                        size="small"
                    ></lightning-spinner>
                </template>
                <c-lqc-datatable
                    key-field="id"
                    data={sortedRows}
                    columns={columns}
                    draft-values={draftValues}
                    sorted-by={sortedBy}
                    sorted-direction={sortDirection}
                    onsort={handleSort}
                    onsave={handleCellSave}
                    onrowaction={handleRowAction}
                ></c-lqc-datatable>
            </template>
        </div>
    </div>

    <!-- Add-row modal -->
    <template lwc:if={showAddModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open"
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title slds-hyphenate">Add row - {title}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template for:each={modalInputs} for:item="input">
                        <template lwc:if={input.isPicklist}>
                            <lightning-combobox
                                key={input.key}
                                data-key={input.key}
                                label={input.label}
                                value={input.value}
                                options={input.options}
                                placeholder="Select..."
                                onchange={handleModalInputChange}
                                class="slds-m-bottom_x-small"
                            ></lightning-combobox>
                        </template>
                        <template lwc:else>
                            <lightning-input
                                key={input.key}
                                data-key={input.key}
                                type={input.inputType}
                                step={input.step}
                                max={input.max}
                                label={input.label}
                                value={input.value}
                                onchange={handleModalInputChange}
                                class="slds-m-bottom_x-small"
                            ></lightning-input>
                        </template>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={handleModalCancel}
                        class="slds-m-right_x-small"
                    ></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Add"
                        onclick={handleModalSave}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
